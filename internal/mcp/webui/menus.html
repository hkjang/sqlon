<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 관리 · sqlon</title>
<style>
  main { max-width: 980px; margin: 0 auto; padding: 16px 20px 60px; }
  .card { border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 14px; }
  .intro { color: var(--text-2); font-size: 13.5px; }
  .intro p { margin: 0 0 6px; }
  .intro p:last-child { margin: 0; }
  .meta-line { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  .mm-bar {
    position: sticky; top: calc(var(--header-h) + 8px); z-index: 5; /* below the sticky page header */
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
  }
  .mm-preview { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; align-items: center; }
  .mm-count {
    font: inherit; font-size: 12.5px; color: var(--text-2); background: var(--surface-3); border: 1px solid transparent;
    border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  }
  button.mm-count { cursor: pointer; }
  button.mm-count:hover { border-color: var(--border-strong); }
  button.mm-count[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent-strong); }
  .mm-count b { color: var(--text); }
  button.mm-count[aria-pressed="true"] b { color: var(--accent-strong); }
  .mm-count.zero { background: var(--danger-bg); color: var(--danger); }
  .mm-count.zero b { color: var(--danger); }
  .mm-preview-hint { font-size: 12px; color: var(--muted); }
  .mm-actions { display: flex; gap: 8px; align-items: center; }
  .mm-dirty { font-size: 12.5px; color: var(--warn); font-weight: 600; white-space: nowrap; }
  .mm-line { flex-basis: 100%; font-size: 13px; margin: 0; }
  .mm-line:empty { display: none; }
  .mm-line.ok { color: var(--ok); }
  .mm-line.bad { color: var(--danger); }
  .mm-line.warn { color: var(--warn); }
  .mm-view { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text-2); }
  .mm-view b { color: var(--accent-strong); }
  .mm-linkbtn { font: inherit; font-size: 12.5px; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }

  .mm-tools { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .mm-search { position: relative; flex: 1; max-width: 360px; }
  .mm-search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .mm-search input { width: 100%; padding-left: 32px; }
  .mm-shown { font-size: 12.5px; color: var(--muted); }

  .mm-group { padding: 0; overflow: hidden; }
  .mm-ghead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .mm-ghead h2 { font-size: 14px; margin: 0; flex: 1; color: var(--text); text-transform: none; letter-spacing: 0; border: 0; padding: 0; }
  .mm-gcount { font-size: 12.5px; color: var(--muted); }
  .mm-row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 6px 14px;
    padding: 11px 16px; border-bottom: 1px solid var(--border);
  }
  .mm-row:last-child { border-bottom: 0; }
  .mm-row > .ic { width: 20px; height: 20px; color: var(--muted); }
  .mm-row.off > .ic { color: var(--faint); }
  .mm-row.off .mm-name { color: var(--muted); }
  .mm-row.unseen { background: var(--surface-2); }
  .mm-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .mm-hint { font-size: 12.5px; color: var(--muted); }
  .mm-tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; background: var(--surface-3); color: var(--text-2); }
  .mm-tag.lock { background: var(--accent-bg); color: var(--accent-strong); }
  .mm-tag.changed { background: var(--warn-bg); color: var(--warn); }
  .mm-tag.unseen { background: var(--danger-bg); color: var(--danger); }
  .mm-roles { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .mm-role {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2);
    border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 10px 3px 7px; cursor: pointer; user-select: none;
  }
  .mm-role input { margin: 0; accent-color: var(--accent-solid); cursor: pointer; }
  .mm-role.on { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent-strong); }
  .mm-role.na { border-style: dashed; color: var(--faint); cursor: not-allowed; }
  .mm-role.na input, .mm-role.dim input { cursor: not-allowed; }
  .mm-role.dim { opacity: .5; cursor: not-allowed; }
  .mm-role:focus-within { box-shadow: var(--focus-ring); }
  body.standalone .mm-roles { display: none; }
  .mm-empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  .mm-history h2 { font-size: 14px; margin: 0 0 10px; color: var(--text); text-transform: none; letter-spacing: 0; border: 0; padding: 0; }
  .mm-history ol { list-style: none; margin: 0; padding: 0; }
  .mm-history li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
  .mm-history li:first-child { border-top: 0; }
  .mm-history time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mm-history .who { font-weight: 600; color: var(--text); white-space: nowrap; }
  .mm-history .rev { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .mm-history .none { color: var(--muted); font-size: 13px; display: block; }

  @media (max-width: 680px) {
    main { padding: 12px 12px 48px; }
    .mm-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
    .mm-roles { grid-column: 2 / -1; justify-content: flex-start; }
    .mm-row .ui-switch { grid-column: 3; grid-row: 1; }
    .mm-actions { width: 100%; }
    .mm-actions .btn { flex: 1; }
    .mm-search { max-width: none; }
    /* the sticky bar shares a phone screen with the list: keep it short */
    .mm-bar { padding: 8px 10px; gap: 8px; }
    .mm-preview-hint, .mm-long { display: none; }
    .mm-view, .mm-line { font-size: 12.5px; }
    .mm-history li { grid-template-columns: auto minmax(0, 1fr); }
    .mm-history li > span:last-child { grid-column: 1 / -1; }
  }
</style>
<link rel="stylesheet" href="/admin/ui.css">
<script src="/admin/theme.js" data-shell></script>
</head>
<body>
<header>
  <h1>메뉴 관리</h1>
  <span class="grow"></span>
  <input id="adminToken" type="password" placeholder="관리 토큰 (단독 모드에서 저장할 때)" autocomplete="off" aria-label="관리 토큰">
</header>
<main>
  <section class="card intro">
    <p>콘솔 메뉴를 <b>켜고 끄거나</b>, 메뉴를 볼 수 있는 <b>역할</b>을 좁힙니다. 저장하면 재시작 없이 모든 사용자에게 바로 적용됩니다.</p>
    <p>끈 메뉴는 사이드바·빠른 이동·바로가기에서 사라지고, 화면 주소로 열어도 열 수 있는 첫 화면으로 돌아갑니다.
      메뉴 설정은 콘솔 화면만 바꿉니다 — REST API와 MCP 도구 권한은 역할과 MCP 키로 통제됩니다.</p>
    <div class="meta-line" id="metaLine"></div>
  </section>
  <div id="loadError"></div>

  <div class="mm-bar" role="region" aria-label="미리 보기와 저장">
    <div class="mm-preview" id="preview"></div>
    <div class="mm-actions">
      <span class="mm-dirty" id="dirty" hidden></span>
      <button type="button" class="btn" id="btnAllOn" title="모든 메뉴를 켜고 역할 제한을 없앱니다 (저장 전까지는 되돌릴 수 있습니다)">모두 켜기</button>
      <button type="button" class="btn" id="btnRevert" disabled>되돌리기</button>
      <button type="button" class="btn primary" id="btnSave" disabled title="저장 (Ctrl+S)">저장</button>
    </div>
    <p class="mm-line warn" id="zeroWarn" aria-live="polite"></p>
    <div class="mm-line mm-view" id="viewNote" aria-live="polite"></div>
    <p class="mm-line" id="msg" role="status"></p>
  </div>

  <div class="mm-tools">
    <label class="mm-search"><span class="sr-only">메뉴 찾기</span><span id="searchIcon"></span>
      <input id="filter" type="search" placeholder="메뉴 찾기 — 이름·설명·주소" autocomplete="off"></label>
    <span class="mm-shown" id="shown" aria-live="polite"></span>
  </div>

  <div id="groups"><div class="card">불러오는 중…</div></div>

  <section class="card mm-history" aria-labelledby="hTitle">
    <h2 id="hTitle">최근 변경</h2>
    <ol id="history"></ol>
    <button type="button" class="mm-linkbtn" id="historyMore" hidden></button>
  </section>
</main>
<script src="/admin/nav.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => JSON.parse(JSON.stringify(v));
const ROLE_LABEL = { admin: '관리자', dba: 'DBA', user: '사용자' };
const RULE_NOTE = { admin: '관리자 전용', manage: '관리자 전용', dba: 'DBA 이상' };
const HISTORY_SHOWN = 8;

let AUTH = false, ROLES = [], SERVER = {}, state = {}, orig = {}, REV = 0, HISTORY = [], META = {};
let viewAs = null, historyAll = false;

function headers(json) {
  const h = json ? { 'Content-Type': 'application/json' } : {};
  const t = $('#adminToken').value;
  if (t) h['X-Admin-Token'] = t;
  return h;
}
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: headers(!!body), body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(res.status === 401 && !AUTH
      ? '관리 토큰이 필요합니다 — 위쪽 [관리 토큰]에 서버의 -admin-token 값을 입력하세요.'
      : (data.error || data.hint || 'HTTP ' + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function menuLabel(key) {
  for (const g of JASQL.menu || []) for (const it of g.items) if (it.key === key) return it.label;
  return key;
}
function rolesText(roles) { return roles.map(r => ROLE_LABEL[r] || r).join('·'); }
function when(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
// visible in this mode at all (before any switch)?
function baseVisible(m) { return AUTH || (m.rule !== 'auth' && m.rule !== 'admin'); }
// would role r see this menu with the switches as they are on screen?
function seenBy(key, r) {
  const m = SERVER[key], st = state[key];
  if (!(m.allowed_roles || []).includes(r)) return false;
  return m.locked || (st.enabled && st.roles.includes(r));
}
function snapshot(menus) {
  const out = {};
  menus.forEach(m => { out[m.key] = { enabled: m.enabled, roles: (m.roles || []).slice() }; });
  return out;
}
function same(a, b) {
  return a.enabled === b.enabled && a.roles.slice().sort().join() === b.roles.slice().sort().join();
}
function changedKeys() { return Object.keys(state).filter(k => !same(state[k], orig[k])); }

function apply(d) {
  AUTH = !!d.auth_enabled;
  ROLES = d.roles || [];
  document.body.classList.toggle('standalone', !AUTH);
  SERVER = {};
  (d.menus || []).forEach(m => { SERVER[m.key] = m; });
  state = snapshot(d.menus || []);
  orig = snapshot(d.menus || []);
  REV = d.revision || 0;
  HISTORY = d.history || [];
  META = d;
  if (!AUTH) viewAs = null;
}

async function load() {
  apply(await api('GET', '/api/console/menus'));
  render();
}

function render() {
  $('#metaLine').textContent = (META.updated_at ? '마지막 변경 ' + when(META.updated_at) + (META.updated_by ? ' · ' + META.updated_by : '') : '아직 바꾼 적 없음 — 모든 메뉴가 켜져 있습니다') +
    (AUTH ? '' : ' · 단독 모드: 역할이 없어 켜기·끄기만 적용됩니다') + ' · 저장 위치 ' + (META.storage || '');
  $('#loadError').innerHTML = META.load_error
    ? '<div class="ui-notice" role="alert">' + JASQL.icon('x') + '<div><b>설정 파일을 읽지 못해 모든 메뉴가 켜진 상태로 동작 중입니다.</b><span>' + esc(META.load_error) + ' — 이 화면에서 저장하면 파일을 새로 씁니다.</span></div></div>'
    : '';

  const q = $('#filter').value.trim().toLowerCase().replace(/\s+/g, '');
  const match = (g, it) => !q || (g.title + it.label + (it.hint || '') + SERVER[it.key].path).toLowerCase().replace(/\s+/g, '').includes(q);
  let shown = 0, total = 0;
  const groups = (JASQL.menu || []).map(g => {
    const all = g.items.filter(it => SERVER[it.key] && baseVisible(SERVER[it.key]));
    total += all.length;
    const items = all.filter(it => match(g, it));
    shown += items.length;
    return { g, all, items };
  }).filter(x => x.items.length);

  $('#groups').innerHTML = groups.length ? groups.map(({ g, all, items }) => {
    const free = all.filter(it => !SERVER[it.key].locked);
    const on = all.filter(it => state[it.key].enabled).length;
    const allOn = free.every(it => state[it.key].enabled), anyOn = free.some(it => state[it.key].enabled);
    return '<section class="card mm-group" data-group="' + esc(g.id) + '" aria-labelledby="g-' + esc(g.id) + '">' +
      '<div class="mm-ghead"><h2 id="g-' + esc(g.id) + '">' + esc(g.title) + '</h2><span class="mm-gcount">' + on + ' / ' + all.length + ' 켜짐</span>' +
      (free.length ? '<input type="checkbox" class="ui-switch" data-gswitch="' + esc(g.id) + '" aria-label="' + esc(g.title) + ' 그룹 전체 켜기"' + (allOn ? ' checked' : '') + (anyOn && !allOn ? ' data-mixed' : '') + '>' : '') +
      '</div>' + items.map(row).join('') + '</section>';
  }).join('') : '<div class="card mm-empty">"' + esc($('#filter').value) + '"에 맞는 메뉴가 없습니다.</div>';
  document.querySelectorAll('[data-mixed]').forEach(n => { n.indeterminate = true; });
  $('#shown').textContent = q ? shown + ' / ' + total + '개 메뉴' : '';
  bind();
  summarize();
  renderHistory();
}

function row(it) {
  const m = SERVER[it.key], st = state[it.key];
  const changed = !same(st, orig[it.key]);
  const unseen = viewAs && !seenBy(it.key, viewAs);
  const roles = ROLES.map(r => {
    const allowed = (m.allowed_roles || []).includes(r);
    const checked = allowed && st.roles.includes(r);
    const cls = 'mm-role' + (!allowed ? ' na' : checked ? ' on' : '') + (allowed && (!st.enabled || m.locked) ? ' dim' : '');
    const title = !allowed ? '이 메뉴의 기본 권한 밖입니다' : m.locked ? '메뉴 관리는 관리자에게 항상 보입니다' : '';
    return '<label class="' + cls + '"' + (title ? ' title="' + esc(title) + '"' : '') + '><input type="checkbox" data-role="' + r + '" data-key="' + esc(it.key) + '"' +
      (checked ? ' checked' : '') + (!allowed || !st.enabled || m.locked ? ' disabled' : '') + '><span>' + esc(ROLE_LABEL[r] || r) + '</span></label>';
  }).join('');
  const tags = (m.locked ? '<span class="mm-tag lock">항상 켜짐</span>' : '') +
    (AUTH && RULE_NOTE[m.rule] ? '<span class="mm-tag">' + esc(RULE_NOTE[m.rule]) + '</span>' : '') +
    (changed ? '<span class="mm-tag changed">저장 안 함</span>' : '') +
    (unseen ? '<span class="mm-tag unseen">' + esc(ROLE_LABEL[viewAs]) + '에게 안 보임</span>' : '');
  return '<div class="mm-row' + (st.enabled ? '' : ' off') + (unseen ? ' unseen' : '') + '">' + JASQL.icon(it.icon) +
    '<div><div class="mm-name">' + esc(it.label) + tags + '</div><div class="mm-hint">' + esc(it.hint || '') + ' · <code>' + esc(m.path) + '</code></div></div>' +
    '<div class="mm-roles" role="group" aria-label="' + esc(it.label) + ' 을(를) 볼 수 있는 역할">' + roles + '</div>' +
    '<input type="checkbox" role="switch" class="ui-switch" data-key="' + esc(it.key) + '" aria-label="' + esc(it.label) + ' 켜기"' +
      (st.enabled ? ' checked' : '') + (m.locked ? ' disabled' : '') + '>' +
    '</div>';
}

function bind() {
  document.querySelectorAll('.mm-row .ui-switch').forEach(sw => {
    sw.onchange = () => { state[sw.dataset.key].enabled = sw.checked; rerender(sw); };
  });
  document.querySelectorAll('[data-gswitch]').forEach(sw => {
    sw.onchange = () => {
      const g = (JASQL.menu || []).find(x => x.id === sw.dataset.gswitch);
      g.items.forEach(it => { if (SERVER[it.key] && !SERVER[it.key].locked && baseVisible(SERVER[it.key])) state[it.key].enabled = sw.checked; });
      rerender(sw);
    };
  });
  document.querySelectorAll('.mm-role input').forEach(cb => {
    cb.onchange = () => {
      const st = state[cb.dataset.key];
      if (cb.checked) { if (!st.roles.includes(cb.dataset.role)) st.roles.push(cb.dataset.role); }
      else if (st.roles.length <= 1) {
        cb.checked = true;
        say('bad', '역할을 모두 빼려면 대신 메뉴를 끄세요.');
        return;
      } else st.roles = st.roles.filter(r => r !== cb.dataset.role);
      rerender(cb);
    };
  });
}

// re-render but keep keyboard focus on the control that changed
function rerender(ctrl, keepMsg) {
  const sel = ctrl.dataset.gswitch ? '[data-gswitch="' + ctrl.dataset.gswitch + '"]'
    : ctrl.dataset.view ? 'button.mm-count[data-view="' + ctrl.dataset.view + '"]'
    : ctrl.dataset.role ? 'input[data-key="' + ctrl.dataset.key + '"][data-role="' + ctrl.dataset.role + '"]'
    : '.mm-row .ui-switch[data-key="' + ctrl.dataset.key + '"]';
  render();
  const n = document.querySelector(sel);
  if (n) n.focus();
  if (!keepMsg) say('', '');
}

function summarize() {
  const menus = Object.values(SERVER).filter(baseVisible);
  const parts = [], zero = [];
  if (AUTH) {
    ROLES.forEach(r => {
      const base = menus.filter(m => (m.allowed_roles || []).includes(r));
      const n = base.filter(m => seenBy(m.key, r)).length;
      if (!n) zero.push(ROLE_LABEL[r] || r);
      parts.push('<button type="button" class="mm-count' + (n ? '' : ' zero') + '" data-view="' + r + '" aria-pressed="' + (viewAs === r) + '" title="' + esc(ROLE_LABEL[r]) + '에게 보이는 화면으로 표시">' +
        esc(ROLE_LABEL[r] || r) + ' <b>' + n + '</b> / ' + base.length + '</button>');
    });
    parts.push('<span class="mm-preview-hint">역할을 누르면 그 역할로 봅니다</span>');
  } else {
    const n = menus.filter(m => m.locked || state[m.key].enabled).length;
    parts.push('<span class="mm-count">보이는 메뉴 <b>' + n + '</b> / ' + menus.length + '</span>');
  }
  const ch = changedKeys().length;
  $('#preview').innerHTML = parts.join('');
  $('#dirty').hidden = !ch;
  $('#dirty').innerHTML = '<span class="mm-long">저장하지 않은 </span>변경 ' + ch + '건';
  $('#btnSave').disabled = !ch;
  $('#btnRevert').disabled = !ch;
  $('#zeroWarn').textContent = zero.length ? zero.join('·') + ' 역할이 열 수 있는 화면이 없습니다 — 저장하면 이 역할은 로그인해도 안내 페이지만 봅니다.' : '';
  if (viewAs) {
    const hidden = Object.keys(SERVER).filter(k => baseVisible(SERVER[k]) && (SERVER[k].allowed_roles || []).includes(viewAs) && !seenBy(k, viewAs));
    const seen = Object.keys(SERVER).filter(k => seenBy(k, viewAs)).length;
    $('#viewNote').innerHTML = '<span><b>' + esc(ROLE_LABEL[viewAs]) + '</b>로 보는 중 — 보이는 메뉴 ' + seen + '개' +
      (hidden.length ? ', 꺼서 숨긴 메뉴 ' + hidden.length + '개(' + esc(hidden.map(menuLabel).join(', ')) + ')' : '') + '</span>' +
      '<button type="button" class="mm-linkbtn" id="viewOff">그만 보기</button>';
    $('#viewOff').onclick = () => { viewAs = null; render(); };
  } else {
    $('#viewNote').innerHTML = '';
  }
}

function describeChange(c) {
  const from = c.from || {}, to = c.to || {};
  const parts = [];
  if ((from.enabled === false) !== (to.enabled === false)) parts.push(to.enabled === false ? '끔' : '켬');
  if (JSON.stringify(from.roles || null) !== JSON.stringify(to.roles || null)) parts.push(to.roles ? rolesText(to.roles) + '만' : '모든 역할에 보임');
  return menuLabel(c.key) + ' ' + parts.join(' · ');
}
function renderHistory() {
  const list = historyAll ? HISTORY : HISTORY.slice(0, HISTORY_SHOWN);
  $('#history').innerHTML = list.length ? list.map(h =>
    '<li><time datetime="' + esc(h.at) + '">' + esc(when(h.at)) + '</time><span class="who">' + esc(h.by || '') + '<span class="rev">#' + h.revision + '</span></span>' +
    '<span>' + esc([h.repaired ? '설정 파일 복구' : ''].concat((h.changes || []).map(describeChange)).filter(Boolean).join(', ')) + '</span></li>').join('')
    : '<li class="none">아직 변경 이력이 없습니다.</li>';
  const more = $('#historyMore');
  more.hidden = HISTORY.length <= HISTORY_SHOWN;
  more.textContent = historyAll ? '최근 ' + HISTORY_SHOWN + '건만 보기' : '이전 변경 ' + (HISTORY.length - HISTORY_SHOWN) + '건 더 보기';
}
$('#historyMore').onclick = () => { historyAll = !historyAll; renderHistory(); };
// the role counts are redrawn on every change, so their clicks are handled here
$('#preview').addEventListener('click', e => {
  const b = e.target.closest('button.mm-count[data-view]');
  if (!b) return;
  viewAs = viewAs === b.dataset.view ? null : b.dataset.view;
  rerender(b, true);
});

function say(cls, text) { const m = $('#msg'); m.className = 'mm-line' + (cls ? ' ' + cls : ''); m.textContent = text; }

// Another admin saved while this page was open: take their settings and put
// this page's unsaved changes back on top, saying where both touched the same menu.
function rebase(latest) {
  const mine = {};
  changedKeys().forEach(k => { mine[k] = clone(state[k]); });
  const before = orig;
  apply(latest);
  const theirs = Object.keys(orig).filter(k => before[k] && !same(orig[k], before[k]));
  Object.keys(mine).forEach(k => { if (state[k]) state[k] = mine[k]; });
  render();
  const overlap = Object.keys(mine).filter(k => theirs.includes(k));
  say('warn', (latest.updated_by || '다른 관리자') + '님이 ' + when(latest.updated_at) + '에 먼저 저장했습니다. 그 설정을 불러와 내 변경 ' +
    Object.keys(mine).length + '건을 그 위에 다시 얹었습니다' +
    (overlap.length ? ' — 같은 메뉴(' + overlap.map(menuLabel).join(', ') + ')는 내 값으로 두었습니다' : '') + '. 확인한 뒤 다시 저장하세요.');
}

async function save() {
  const menus = {};
  Object.keys(state).forEach(k => {
    const m = SERVER[k], st = state[k];
    if (m.locked) return;
    const allowed = m.allowed_roles || [];
    const narrowed = AUTH && allowed.some(r => !st.roles.includes(r));
    menus[k] = { enabled: st.enabled, roles: narrowed ? st.roles.slice() : null };
  });
  $('#btnSave').disabled = true;
  try {
    const d = await api('PUT', '/api/console/menus', JSON.stringify({ revision: REV, menus }));
    apply(d);
    render();
    if (JASQL.rebuildNav) JASQL.rebuildNav(d.hidden_for_you || []);
    say('ok', '저장했습니다. 모든 사용자에게 바로 적용됩니다.');
  } catch (e) {
    if (e.status === 409 && e.data && e.data.menus) { rebase(e.data); return; }
    say('bad', '저장하지 못했습니다: ' + e.message);
    summarize();
  }
}

$('#searchIcon').outerHTML = JASQL.icon('search');
$('#filter').addEventListener('input', () => render());
$('#btnSave').onclick = save;
$('#btnRevert').onclick = () => { state = clone(orig); render(); say('', ''); };
$('#btnAllOn').onclick = () => {
  Object.keys(state).forEach(k => { state[k].enabled = true; state[k].roles = (SERVER[k].allowed_roles || []).slice(); });
  render();
  say('', '');
};
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    if (!$('#btnSave').disabled) save();
  }
});
window.addEventListener('beforeunload', e => { if (changedKeys().length) { e.preventDefault(); e.returnValue = ''; } });

JASQL.mount({ page: 'menus', onReady: () => load().catch(e => {
  $('#groups').innerHTML = '<div class="card">메뉴 설정을 불러오지 못했습니다: ' + esc(e.message) + '</div>';
}) });
</script>
</body>
</html>
